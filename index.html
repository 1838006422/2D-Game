<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#10141d" />
    <title>边境防守 · 塔防原型</title>
  </head>
  <body>
    <div id="app">
      <section id="menu-screen" class="menu-screen">
        <div class="menu-card">
          <span class="eyebrow">DEFENCE PROTOTYPE</span>
          <h1>边境防守战</h1>
          <p class="muted">采集资源、建起工事，守住核心，撑过一波波怪物。</p>
          <div id="best-score" class="best-score"></div>
          <button id="start-defense" class="primary-button">开始防守 <span>→</span></button>
          <div class="camp-actions">
            <button id="open-character-page" class="secondary-button">人物信息</button>
            <button id="open-pet-page" class="secondary-button">灵狐技能</button>
          </div>
          <div id="loadout-summary" class="loadout-summary"></div>
          <div class="controls-hint">
            <span><b>WASD</b> 移动</span><span><b>左键</b> 攻击 / 采集</span><span><b>右键</b> 建造 / 维修</span><span><b>F</b> 升级工事</span><span><b>Q</b> 风刃</span><span><b>4-9</b> 切换建筑</span>
          </div>
        </div>
      </section>

      <div id="game-screen" class="hidden">
        <header class="topbar">
          <div><span class="eyebrow">DEFENCE RUN</span><h1>边境防守战</h1></div>
          <button id="leave-run" class="secondary-button">放弃并返回</button>
        </header>
        <main><div id="game"></div></main>
        <footer class="controls">
          <div class="control-group"><span class="key">W A S D</span><span>移动</span></div>
          <div class="control-group"><span class="key">左键</span><span>攻击 / 采集</span></div>
          <div class="control-group"><span class="key">右键</span><span>建造 / 维修</span></div>
          <div class="control-group"><span class="key">Q</span><span>风刃</span></div>
          <div class="control-group"><span class="key">4-9</span><span>切换建筑 · F 升级附近工事</span></div>
        </footer>
        <div id="overlay" class="overlay hidden">
          <div class="modal">
            <span class="eyebrow">DEFENCE REPORT</span>
            <h2 id="result-title"></h2>
            <p id="result-text"></p>
            <div id="route-options" class="route-options hidden"></div>
            <div class="modal-actions">
              <button id="continue" class="primary-button hidden"></button>
              <button id="return-hub" class="secondary-button">返回营地</button>
            </div>
          </div>
        </div>
      </div>

      <div id="character-page" class="overlay hidden">
        <div class="modal wide">
          <header class="modal-header">
            <div><span class="eyebrow">CHARACTER PROFILE</span><h2>人物信息</h2></div>
            <button id="close-character-page" class="modal-close" aria-label="关闭">×</button>
          </header>
          <div id="character-summary" class="character-summary"></div>
          <nav class="character-tabs">
            <button data-character-tab="overview" class="active">人物预览</button>
            <button data-character-tab="skills">人物技能</button>
            <button data-character-tab="equipment">装备管理</button>
          </nav>
          <div id="character-content" class="character-content"></div>
        </div>
      </div>

      <div id="pet-page" class="overlay hidden">
        <div class="modal">
          <header class="modal-header">
            <div><span class="eyebrow">FOX LOADOUT</span><h2>灵狐技能</h2></div>
            <button id="close-pet-page" class="modal-close" aria-label="关闭">×</button>
          </header>
          <p id="pet-page-hint" class="muted"></p>
          <div id="pet-skill-list" class="pet-skill-list"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
